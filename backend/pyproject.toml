[project]
name = "agent-platform-backend"
version = "0.1.0"
description = "智能体平台后端服务"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "pydantic>=2.5.3",
    "pydantic[email]>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "markitdown[pdf,docx,xlsx,xls]>=0.0.1",
    "beautifulsoup4>=4.12.0",
    "chardet>=5.2.0",
    "fastembed>=0.2.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-core>=0.1.10",
    "langgraph>=0.1.0",
    "apscheduler>=3.10.4",
    "arxiv>=2.1.0",
    # ---- 学习助手（Learning） ----
    "yt-dlp>=2024.8.6",       # YouTube / B站 元数据与字幕抓取（需频繁升级以应对反爬）
    "pypdf>=4.3.1",           # PDF 页数与书签大纲
    "python-pptx>=0.6.23",    # PPTX 逐 slide 结构化抽取
    "ebooklib>=0.18",         # EPUB 按 spine 拆章节
    "Pillow>=10.3.0",         # 画布导出图压缩
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "black>=23.12.1",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]
sqlite = [
    "sqlite-vec>=0.1.0",
    "aiosqlite>=0.19.0",
]
postgres = [
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "asyncpg>=0.29.0",
]
qdrant = [
    "qdrant-client>=1.7.0",
]
evaluation = [
    "datasets>=2.14.0",
]
# Paper Agent 的 DeepEval 评测（依赖较重，按需安装）
paper-eval = [
    "deepeval>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
